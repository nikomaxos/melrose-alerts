<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melrose Alerts Configuration</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f5f5f5; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; color: #555; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .help-text { font-size: 0.85em; color: #777; margin-top: 5px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: 600; }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>Melrose Alerts Setup</h2>
    
    <div id="status"></div>

    <form id="configForm">
        <div class="form-group">
            <label for="destination_number">Destination Mobile Number</label>
            <input type="text" id="destination_number" required>
            <div class="help-text">The number that will receive the SMS alerts (e.g. 306912345678).</div>
        </div>

        <div class="form-group">
            <label for="delivery_rate_threshold_percent">Delivery Rate Threshold (%)</label>
            <input type="number" id="delivery_rate_threshold_percent" step="0.1" required>
            <div class="help-text">Alert if the delivery rate falls below this percentage.</div>
        </div>

        <div class="form-group">
            <label for="pending_messages_threshold">Pending Messages Threshold</label>
            <input type="number" id="pending_messages_threshold" required>
            <div class="help-text">Alert if pending messages count is greater than this value.</div>
        </div>

        <div class="form-group">
            <label for="pending_messages_duration_seconds">Pending Messages Duration (Seconds)</label>
            <input type="number" id="pending_messages_duration_seconds" required>
            <div class="help-text">How many seconds pending messages must stay above the threshold before sending the alert.</div>
        </div>

        <button type="submit">Save Configuration</button>
    </form>
</div>

<script>
    async function loadConfig() {
        try {
            const res = await fetch('/api/config');
            const config = await res.json();
            
            document.getElementById('destination_number').value = config.smpp.destination_number;
            document.getElementById('delivery_rate_threshold_percent').value = config.alerting.delivery_rate_threshold_percent;
            document.getElementById('pending_messages_threshold').value = config.alerting.pending_messages_threshold;
            document.getElementById('pending_messages_duration_seconds').value = config.alerting.pending_messages_duration_seconds;
        } catch (err) {
            console.error('Error loading config:', err);
        }
    }

    document.getElementById('configForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const statusDiv = document.getElementById('status');
        
        const payload = {
            destination_number: document.getElementById('destination_number').value,
            delivery_rate_threshold_percent: document.getElementById('delivery_rate_threshold_percent').value,
            pending_messages_threshold: document.getElementById('pending_messages_threshold').value,
            pending_messages_duration_seconds: document.getElementById('pending_messages_duration_seconds').value
        };

        try {
            const res = await fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            if (res.ok) {
                statusDiv.className = 'success';
                statusDiv.innerText = 'Configuration saved successfully! Poller updated.';
                statusDiv.style.display = 'block';
                setTimeout(() => statusDiv.style.display = 'none', 3000);
            } else {
                throw new Error('Failed to save');
            }
        } catch (err) {
            statusDiv.className = 'error';
            statusDiv.innerText = 'Error saving configuration.';
            statusDiv.style.display = 'block';
        }
    });

    loadConfig();
</script>

</body>
</html>
